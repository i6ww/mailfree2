name = "mailfree2"
main = "src/server.js"
compatibility_date = "2024-01-01"

# Keep variables configured in the Cloudflare Dashboard.
keep_vars = true

# Keep the existing custom domain route configured for this Worker.
routes = [
  { pattern = "mail.xycm.site", zone_name = "xycm.site", custom_domain = true }
]

[[d1_databases]]
binding = "TEMP_MAIL_DB"
database_name = "mail_free_db"
database_id = "0a61559e-a82a-41bf-a34c-4283373594b9"

[assets]
directory = "public"
binding = "ASSETS"

[[r2_buckets]]
binding = "MAIL_EML"
bucket_name = "mail-eml"

# [observability.logs]
# enabled = true
